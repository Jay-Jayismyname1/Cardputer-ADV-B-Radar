[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit NeoPixel @ ^1.12.3
    mikalhart/TinyGPSPlus @ ^1.1.0

board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs
 ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = +<radar_math.cpp>
; Without this, `pio test` only builds lib/ + test/ and never links
; radar_math.cpp in at all - it happened to go unnoticed while every
; other native-tested module (unit_math.h, alert_filter.h) was header-only
; and needed no separate compiled translation unit.
test_build_src = yes

